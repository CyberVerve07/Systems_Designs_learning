name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Java Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test All Modules
        run: |
          set -e
          echo "Discovered Maven modules:"
          find code -name "pom.xml" -sort
          
          find code -name "pom.xml" | while read -r pom; do
            echo "=================================================="
            echo "Building: $pom"
            echo "=================================================="
            mvn -B -f "$pom" clean test-compile
          done
