# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.systemdesign.conferencing=INFO
logging.level.org.springframework.web.socket=INFO

# Application Properties for SFU Orchestration
app.conferencing.sfu.provider=mediasoup
app.conferencing.sfu.worker-count=4
app.conferencing.sfu.rtc-min-port=20000
app.conferencing.sfu.rtc-max-port=29999
app.conferencing.sfu.mock-mode=true
app.conferencing.sfu.external-worker-url=http://localhost:3000

# STUN / TURN Server Configuration for NAT Traversal
app.conferencing.ice.stun-servers=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
app.conferencing.ice.turn-enabled=false
app.conferencing.ice.turn-server=turn:turn.example.com:3478
app.conferencing.ice.turn-username=guest
app.conferencing.ice.turn-credential=guestpassword

